# TenderHub — nginx reverse proxy
#
# TOPOLOGY (BUILD_RULES Rule 3: the browser never talks to the API directly).
#
#   internet ──▶ nginx :443 ──▶ web:3000            (Next.js, incl. the /api/* BFF)
#                                   │
#                                   └─(server-side)─▶ nginx :8080 ──▶ api:9000  (PHP-FPM)
#
# The public server (:443) proxies EVERYTHING to Next.js — there is no public
# location that reaches PHP. The previous config had `location /api/` fastcgi-
# passing straight to PHP-FPM, which shadowed every BFF route and published
# CodeIgniter to the internet with its own CORS/rate-limit posture. That is the
# single change that made all of the BFF's auth work reachable-but-bypassable.
#
# The :8080 server is the HTTP→FastCGI gateway the BFF uses to reach PHP. It is
# NOT published to the host in docker-compose (no `ports:` entry), so it is only
# reachable on the internal docker network — i.e. by the web container. Set the
# web service's API_BASE to http://nginx:8080.

# --- 1. HTTP → HTTPS redirect + ACME ---------------------------------------
server {
    listen 80;
    server_name tenderhub.lk www.tenderhub.lk;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. Public HTTPS — everything goes to Next.js --------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name tenderhub.lk www.tenderhub.lk;

    ssl_certificate     /etc/letsencrypt/live/tenderhub.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenderhub.lk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers. HSTS is added here (it was absent). X-XSS-Protection is
    # deliberately NOT set — it is deprecated, ignored by current browsers, and
    # its legacy filter can itself introduce bugs; CSP (set by the app) is the
    # real control.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    client_max_body_size 35M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upstream timeouts — without these a hung web process holds the
        # connection open indefinitely.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# --- 3. Internal FastCGI gateway for the BFF (NOT published to the host) ----
# Reachable only on the docker network. This is what the Next.js BFF calls as
# API_BASE=http://nginx:8080; the public server above never routes here.
server {
    listen 8080;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    # Headless JSON API: everything is routed through CodeIgniter's front
    # controller. Static assets are not served here.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include            fastcgi_params;
        fastcgi_pass       api:9000;
        fastcgi_index      index.php;
        fastcgi_param      SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param      CI_ENVIRONMENT production;
        fastcgi_read_timeout 60s;
    }
}
